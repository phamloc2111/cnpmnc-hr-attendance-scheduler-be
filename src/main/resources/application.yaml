spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: attendance-scheduler-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hr_attendance}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  attendance:
    grace-minutes: ${ATTENDANCE_GRACE_MINUTES:5}
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: hr-attendance
    token-ttl: PT8H
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    manager-email: ${BOOTSTRAP_MANAGER_EMAIL:}
    manager-password: ${BOOTSTRAP_MANAGER_PASSWORD:}
    employee-email: ${BOOTSTRAP_EMPLOYEE_EMAIL:}
    employee-password: ${BOOTSTRAP_EMPLOYEE_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  timezone: Asia/Ho_Chi_Minh
