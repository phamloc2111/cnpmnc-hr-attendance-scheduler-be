spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:identity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  auth:
    jwt-secret: test-only-signing-secret-at-least-32-bytes-long
  bootstrap:
    enabled: false
  attendance:
    verification:
      workplace-latitude: 10.7726
      workplace-longitude: 106.6579
      radius-meters: 100
      max-time-difference-seconds: 300
logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
debug: false
